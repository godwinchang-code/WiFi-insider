[package]
name = "wifi-insider"
version = "0.1.0"
edition = "2021"
authors = ["WiFi-insider Team"]
description = "Wi-Fi 7 packet analyzer for OpenWrt - detects PHY/MAC/EHT issues from pcap files"
license = "MIT"

[dependencies]
# PCAP parsing
pcap = "1.3"
pcap-file = "2.0"

# Packet parsing
pnet = "0.34"
pnet_macros_support = "0.34"

# Serialization and data structures
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

# CLI and logging
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

# Statistics and analysis
ordered-float = "4.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[bin]]
name = "wifi-insider"
path = "src/main.rs"
